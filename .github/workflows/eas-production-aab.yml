# Push / merge to `production` → Play Store AAB (EAS profile: production)
# Tip: bump app.json + package.json version on `dev`, merge to `production`, then tag vX.Y.Z.
name: EAS Production AAB

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  build-aab:
    name: Build production AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS build (production AAB)
        run: eas build --platform android --profile production --non-interactive

      # Uncomment after `eas submit:configure` is done and you want auto-upload:
      # - name: Submit to Google Play
      #   run: eas submit --platform android --latest --profile production --non-interactive
